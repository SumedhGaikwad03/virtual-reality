# ==============================================================================
# NOTE: This Docker production configuration is currently retained for future
# deployment. The project is presently using a free hosting strategy, so the
# Docker/VPS production deployment is intentionally paused to avoid infrastructure
# costs. The containers have been locally built and verified successfully.
# Do not remove or modify this configuration unless the Docker production
# deployment is resumed. The existing live deployment remains active.
# ==============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Reverse proxy /api/ to backend container
    location /api/ {
        proxy_pass http://backend:10000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # 2. Proxy health check directly
    location /health {
        proxy_pass http://backend:10000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 3. Proxy SEO / dynamic search engine documents and sitemaps to backend
    location ~ ^/(sitemap\.xml|robots\.txt|seo/) {
        proxy_pass http://backend:10000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Immutable hashed Vite assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 5. Public Static Media & Web Manifest
    location ~* \.(ico|png|jpg|jpeg|svg|webp|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 6. React Router SPA Fallback (/admin, /admin/login, /search, /firm, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
