# ==============================================================================
# NOTE: This Docker production configuration is currently retained for future
# deployment. The project is presently using a free hosting strategy, so the
# Docker/VPS production deployment is intentionally paused to avoid infrastructure
# costs. The containers have been locally built and verified successfully.
# Do not remove or modify this configuration unless the Docker production
# deployment is resumed. The existing live deployment remains active.
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vr-backend-prod
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=10000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@virtual2reality.in}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-900000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:10000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - vr-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
        - VITE_VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
    container_name: vr-frontend-prod
    restart: unless-stopped
    ports:
      - "${PROD_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vr-network

networks:
  vr-network:
    driver: bridge
